meta:
  title: "GTA 6 en PS5, PS5 Pro y Xbox: 30 FPS, PSSR… ¿y en PS4 o Xbox One?"
  alt_titles:
    - "¿Merece la pena la PS5 Pro para GTA 6? Lo que ha confirmado Rockstar"
    - "GTA 6 NO tendrá 60 FPS: qué cambia en cada consola"
  publish: "Miércoles 18 de noviembre, 13:00 (hora peninsular)."
  description: |
    ¿Dónde se ve mejor GTA 6? Rockstar ha confirmado que el juego apunta a 30 FPS en todas las consolas. La PS5 Pro no gana fluidez, pero suma PSSR y sombras con trazado de rayos exclusivas. En PS5 hay respuesta háptica y audio 3D Tempest, y en Xbox One se podrá jugar a través de Xbox Cloud Gaming con los ajustes de Xbox Series S. ¿Y en PS4? No hay versión.

    Te lo explicamos consola por consola y te damos consejos para que se vea lo mejor posible desde el primer día.

    📌 Fuente: Rockstar Newswire (10 de noviembre de 2026). Datos a 16 de noviembre de 2026.
  tags: [gta 6 ps5 pro, gta 6 60 fps, gta 6 30 fps, gta 6 ps5, gta 6 xbox series x, gta 6 xbox series s, gta 6 ps4, gta 6 xbox one, gta 6 xbox cloud gaming, gta 6 pssr, gta 6 rendimiento, gta 6 graficos, gta 6 trazado de rayos, gta vi ps5 pro]
  pinned_comment: |
    ¿En qué consola lo vas a jugar? 👇 PS5, PS5 Pro, Series X, Series S… o en la nube.
