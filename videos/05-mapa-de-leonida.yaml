    - "Leonida, la Florida de GTA 6: las 6 zonas confirmadas"
  publish: "Jueves 19 de noviembre, 10:00 (hora peninsular), día de lanzamiento."
  description: |
    El mapa de GTA 6 es todo un estado: Leonida, la versión de Rockstar de Florida. Te explicamos las 6 zonas que Rockstar ha presentado oficialmente: Vice City, Leonida Keys, Grassrivers, Port Gellhorn, Ambrosia y Mount Kalaga National Park. Qué sabemos de cada una, en qué se inspiran y la historia de Vice City en la saga.

    El mapa que aparece en el vídeo es una ilustración aproximada creada por el canal, no el mapa oficial. Datos a 16 de noviembre de 2026.

    📌 Fuente: web oficial de Grand Theft Auto VI (Rockstar Games).
