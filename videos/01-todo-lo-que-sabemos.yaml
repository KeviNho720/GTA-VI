  publish: "Miércoles 18 de noviembre, 18:00 (hora peninsular). Es el vídeo «puerta de entrada» del canal: fíjalo en la portada."
  description: |
    GTA 6 sale el 19 de noviembre de 2026 y aquí tienes TODO lo confirmado en un solo vídeo, sin spoilers: fecha y hora de lanzamiento, precarga y espacio (212 GB), precio y ediciones (Estándar y Ultimate), la edición física sin disco, el mapa de Leonida, Jason y Lucia, los personajes secundarios, si sale en PC, si hay GTA 6 Online y cómo rinde en PS5, PS5 Pro y Xbox.

    Solo información confirmada por Rockstar Games o por las tiendas oficiales. Datos a 16 de noviembre de 2026.

    📌 Fuentes: Rockstar Newswire, soporte oficial de Rockstar Games, tiendas de PlayStation y Xbox.
