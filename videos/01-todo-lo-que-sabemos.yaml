  pinned_comment: |
    ¿Qué es lo que más ganas tienes de hacer en Leonida? 👇 Te leemos.
    Todos los datos del vídeo están confirmados a 16/11/2026. Si Rockstar anuncia algo nuevo, lo actualizamos aquí.
